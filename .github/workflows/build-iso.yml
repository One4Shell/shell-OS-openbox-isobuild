name: Build ShellOS ISO

on:
  push:
    branches:
      - main
    paths:
      - 'profile/**'
      - 'build_custom_iso.sh'
      - '.github/workflows/build-iso.yml'
  schedule:
    # Ogni 1° del mese alle 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:

# Serializza le build: due esecuzioni concorrenti (push + cron) non devono
# sovrascriversi a vicenda sullo stesso tag rolling.
concurrency:
  group: build-iso
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # mkarchiso ha bisogno di loop device e mount: serve un container privilegiato
      options: --privileged
    steps:
      - name: Install build dependencies
        # git serve ad actions/checkout; github-cli per creare la Release.
        # grub fornisce grub-mkstandalone/grub-install richiesti da mkarchiso
        # per il boot mode 'uefi.grub' (altrimenti: "grub-install is not available").
        run: pacman -Syu --noconfirm git archiso github-cli grub

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare releng profile
        # Completa i file base del profilo releng mancanti senza sovrascrivere
        # le personalizzazioni (stessa logica di build_custom_iso.sh)
        run: cp -rn /usr/share/archiso/configs/releng/* profile/

      - name: Build ISO
        # work/ e out/ vengono sempre rimossi prima della build
        run: |
          rm -rf work out
          mkarchiso -v -w work -o out profile/
          ls -lh out

      - name: Rename ISO to a stable filename
        # Nome fisso, così l'URL di download diretto resta valido tra le build.
        run: mv out/*.iso out/shellos-latest-x86_64.iso && ls -lh out

      - name: Compute checksum
        # Nome file senza "out/": sha256sums.txt viene pubblicato in Release e
        # l'utente verifica con "sha256sum -c" nella cartella di download.
        run: (cd out && sha256sum shellos-latest-x86_64.iso) > out/sha256sums.txt && cat out/sha256sums.txt

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: shellos-iso
          path: |
            out/*.iso
            out/sha256sums.txt
          retention-days: 90

      - name: Split ISO into parts under 2 GiB
        # GitHub Releases rifiuta asset >= 2147483648 byte (HTTP 422 "size
        # must be less than 2147483648"): la ISO viene spezzata in parti da
        # 2000M, ricomponibili con lo script join-iso.sh pubblicato in release.
        run: |
          split -b 2000M -d --suffix-length=2 \
            out/shellos-latest-x86_64.iso out/shellos-latest-x86_64.iso.part-
          cat > out/join-iso.sh <<'EOF'
          #!/usr/bin/env bash
          # Ricompone la ISO dalle parti .part-* e ne verifica il checksum.
          # Usage: scaricare tutti i file della release in una stessa cartella,
          # poi eseguire: bash join-iso.sh
          set -euo pipefail
          cat shellos-latest-x86_64.iso.part-* > shellos-latest-x86_64.iso
          sha256sum -c sha256sums.txt
          EOF
          ls -lh out/

      - name: Publish GitHub Release
        # Release rolling con tag fisso: contiene sempre e solo la ISO più
        # recente, spezzata in parti .part-* (limite 2 GiB per asset), più
        # checksum e script di ricomposizione.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TAG="shellos-latest"
          NOTES="Build automatica del $(date -u +%Y-%m-%d).

          Commit: ${GITHUB_SHA}

          La ISO supera i 2 GiB, limite massimo per un singolo asset di GitHub
          Releases, quindi è pubblicata spezzata in parti .part-*. Per
          ricomporla scarica tutti i file della release in una stessa cartella
          ed esegui:

              bash join-iso.sh

          Equivale a concatenare le parti (cat shellos-latest-x86_64.iso.part-*
          > shellos-latest-x86_64.iso) e verificare sha256sum -c sha256sums.txt.

          Su Windows (PowerShell o cmd):
              copy /b shellos-latest-x86_64.iso.part-00+shellos-latest-x86_64.iso.part-01 shellos-latest-x86_64.iso"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "ShellOS (latest)" --notes "$NOTES" --latest
            # Rimuove tutti gli asset vecchi: se la build precedente aveva un
            # numero di parti diverso, --clobber da solo lascerebbe file orfani.
            gh release view "$TAG" --json assets --jq '.assets[].name' \
              | xargs -r -n1 gh release delete-asset "$TAG" --yes
          else
            gh release create "$TAG" \
              --title "ShellOS (latest)" \
              --notes "$NOTES" \
              --latest
          fi
          gh release upload "$TAG" out/shellos-latest-x86_64.iso.part-* out/sha256sums.txt out/join-iso.sh
